<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live-Zähler – seit dem Firmenlauf</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .counter-card {
    width: min(1200px, 96vw);
    padding: 48px 34px;
    text-align: center;
    border-radius: 32px;
    background: rgba(255,255,255,0.96);
    box-shadow: 0 18px 60px rgba(0,0,0,0.12);
  }

  .eyebrow {
    font-size: clamp(16px, 1.5vw, 24px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: .58;
    margin-bottom: 12px;
  }

  h1 {
    margin: 0 0 34px;
    font-size: clamp(28px, 4vw, 58px);
    line-height: 1.05;
    font-weight: 800;
  }

  .counter {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }

  .unit {
    padding: 26px 10px 20px;
    border-radius: 24px;
    background: rgba(0,0,0,0.045);
  }

  .number {
    display: block;
    font-variant-numeric: tabular-nums;
    font-size: clamp(42px, 7vw, 92px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -0.04em;
  }

  .label {
    display: block;
    margin-top: 12px;
    font-size: clamp(13px, 1.5vw, 21px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    opacity: .62;
  }

  .since {
    margin-top: 30px;
    font-size: clamp(15px, 1.8vw, 24px);
    opacity: .65;
  }

  .footer {
    margin-top: 13px;
    font-size: clamp(17px, 2vw, 28px);
    font-weight: 800;
  }

  @media (max-width: 700px) {
    .counter-card { padding: 30px 18px; }
    .counter { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <main class="counter-card">
    <div class="eyebrow">Seit dem Firmenlauf</div>
    <h1>Gemeinsam in Bewegung</h1>

    <section class="counter" aria-label="Vergangene Zeit">
      <div class="unit">
        <span class="number" id="days">0</span>
        <span class="label">Tage</span>
      </div>
      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">Stunden</span>
      </div>
      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Minuten</span>
      </div>
      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Sekunden</span>
      </div>
    </section>

    <div class="since">Start: 02. Juni 2026 · 18:30 Uhr</div>
    <div class="footer">Und wir laufen weiter. 🏃‍♀️🏃‍♂️</div>
  </main>

<script>
  // 02.06.2026, 18:30 Uhr in Deutschland.
  // Am 2. Juni gilt MESZ = UTC+02:00.
  const startTime = new Date("2026-06-02T18:30:00+02:00");

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function updateCounter() {
    const now = new Date();
    let diff = now.getTime() - startTime.getTime();

    if (diff < 0) diff = 0;

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }

  updateCounter();
  setInterval(updateCounter, 1000);
</script>
</body>
</html>
