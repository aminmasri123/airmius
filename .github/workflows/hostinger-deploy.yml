name: Hostinger production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  release:
    # Enable only after the production paths and SSH access have been verified.
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
      - name: Build web assets from this commit
        env:
          VITE_APP_NAME: ${{ vars.HOSTINGER_VITE_APP_NAME }}
          VITE_ECHO_ENABLED: ${{ vars.HOSTINGER_VITE_ECHO_ENABLED }}
          VITE_REVERB_APP_KEY: ${{ vars.HOSTINGER_VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ vars.HOSTINGER_VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ vars.HOSTINGER_VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ vars.HOSTINGER_VITE_REVERB_SCHEME }}
          VITE_PUSHER_APP_KEY: ${{ vars.HOSTINGER_VITE_PUSHER_APP_KEY }}
          VITE_PUSHER_APP_CLUSTER: ${{ vars.HOSTINGER_VITE_PUSHER_APP_CLUSTER }}
          VITE_PUSHER_HOST: ${{ vars.HOSTINGER_VITE_PUSHER_HOST }}
          VITE_PUSHER_PORT: ${{ vars.HOSTINGER_VITE_PUSHER_PORT }}
          VITE_PUSHER_SCHEME: ${{ vars.HOSTINGER_VITE_PUSHER_SCHEME }}
        run: |
          npm ci
          npm run build
          node --test tests/Deployment/buildManifest.test.mjs
          php scripts/deploy/verify-build.php public/build/manifest.json
      - name: Test direct deployment preservation
        run: bash tests/Deployment/hostingerRelease.test.sh
      - name: Test backend against the complete build
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          BROADCAST_CONNECTION: log
        run: |
          touch database/database.sqlite
          php artisan test --log-junit backend-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ github.sha }}
          path: backend-results.xml
          if-no-files-found: ignore
          overwrite: true
      - name: Package complete application
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
          mkdir -p release
          for item in app bootstrap config database lang resources routes public vendor artisan cron-schedule.php composer.json composer.lock; do
            cp -a "$item" release/
          done
          cp scripts/deploy/hostinger-root.htaccess release/.htaccess
          rm -f release/public/hot
          rm -rf release/public/storage
          find release/bootstrap/cache -maxdepth 1 -type f ! -name '.gitignore' -delete
          printf '{"commit":"%s"}\n' "$RELEASE_SHA" > release/public/deployment.json
      - name: Connect and publish release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          DEPLOY_BASE: ${{ vars.HOSTINGER_DEPLOY_BASE }}
          WEB_ROOT: ${{ vars.HOSTINGER_WEB_ROOT }}
          SITE_URL: ${{ vars.HOSTINGER_SITE_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for key in SSH_HOST SSH_PORT SSH_USER SSH_KEY KNOWN_HOSTS DEPLOY_BASE WEB_ROOT SITE_URL; do
            test -n "${!key}" || { echo "Missing deployment setting: $key"; exit 1; }
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_BASE" =~ ^/home/[a-zA-Z0-9_./-]+$ ]]
          [[ "$WEB_ROOT" =~ ^/home/[a-zA-Z0-9_./-]+$ ]]
          [[ "$SITE_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          cleanup() {
            "${SSH[@]}" "$SSH_USER@$SSH_HOST" "cd '$WEB_ROOT' && php artisan up" || true
            rm -f ~/.ssh/deploy_key
          }
          trap cleanup EXIT
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_BASE' && test -f '$WEB_ROOT/artisan' && cd '$WEB_ROOT' && php artisan down --retry=30"
          # rsync compares both trees and transfers only changed/new files.
          # Production configuration and runtime data never come from GitHub.
          rsync -az --checksum --delete --delay-updates \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            --exclude=/.env \
            --exclude=/storage \
            --exclude=/public/storage \
            --exclude=/bootstrap/cache \
            release/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$DEPLOY_BASE' '$WEB_ROOT' '$SITE_URL' '$RELEASE_SHA'" < scripts/deploy/hostinger-release.sh
