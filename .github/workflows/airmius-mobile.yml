name: Airmius Mobile

on:
  push:
    paths:
      - "mobile/airmius_mobile/**"
      - ".github/workflows/airmius-mobile.yml"
  pull_request:
    paths:
      - "mobile/airmius_mobile/**"
      - ".github/workflows/airmius-mobile.yml"
  workflow_dispatch:

jobs:
  flutter-mobile:
    name: Flutter analyze and Android release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/airmius_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Release configuration check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_evidence | Out-Null
          ./scripts/assert_release_configuration.ps1 -ApiBaseUrl "https://airmius.com" -UseHttp 2>&1 | Tee-Object -FilePath release_evidence/release-configuration-check.log

      - name: Release secrets hygiene check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_evidence | Out-Null
          ./scripts/assert_no_release_secrets.ps1 2>&1 | Tee-Object -FilePath release_evidence/release-secrets-hygiene.log

      - name: Release version consistency check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_evidence | Out-Null
          ./scripts/assert_release_version_consistency.ps1 2>&1 | Tee-Object -FilePath release_evidence/release-version-consistency.log

      - name: Logo/theme asset mapping check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_evidence | Out-Null
          ./scripts/assert_logo_theme_assets.ps1 2>&1 | Tee-Object -FilePath release_evidence/logo-theme-assets.log

      - name: Install dependencies
        run: |
          mkdir -p release_evidence
          flutter pub get 2>&1 | tee release_evidence/flutter-pub-get.log

      - name: Flutter dependency lock
        shell: pwsh
        run: ./scripts/assert_flutter_dependency_lock.ps1 2>&1 | Tee-Object -FilePath release_evidence/flutter-dependency-lock.log

      - name: Analyze
        run: flutter analyze 2>&1 | tee release_evidence/flutter-analyze.log

      - name: Android App Bundle release build
        run: flutter build appbundle --release --dart-define=AIRMIUS_USE_HTTP=true --dart-define=AIRMIUS_API_BASE_URL=https://airmius.com 2>&1 | tee release_evidence/android-appbundle-build.log

      - name: Android APK release build
        run: flutter build apk --release --dart-define=AIRMIUS_USE_HTTP=true --dart-define=AIRMIUS_API_BASE_URL=https://airmius.com 2>&1 | tee release_evidence/android-apk-build.log

      - name: Collect Android artifacts
        if: always()
        run: |
          mkdir -p release_evidence/artifacts
          cp build/app/outputs/bundle/release/app-release.aab release_evidence/artifacts/app-release.aab 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk release_evidence/artifacts/app-release.apk 2>/dev/null || true

      - name: Sync release evidence manifest
        if: always()
        shell: pwsh
        run: ./scripts/sync_release_evidence_manifest.ps1

      - name: Validate release evidence manifest
        if: always()
        shell: pwsh
        run: ./scripts/assert_release_manifest_integrity.ps1

      - name: Export release evidence report
        if: always()
        shell: pwsh
        run: |
          ./scripts/export_release_evidence_report.ps1
          ./scripts/export_next_release_steps_report.ps1

      - name: Package release evidence bundle
        if: always()
        shell: pwsh
        run: |
          ./scripts/package_release_evidence_bundle.ps1
          ./scripts/assert_evidence_bundle_contents.ps1 2>&1 | Tee-Object -FilePath release_evidence/release-evidence-bundle-contents.log
          ./scripts/sync_release_evidence_manifest.ps1
          ./scripts/export_release_evidence_report.ps1
          ./scripts/export_next_release_steps_report.ps1
          ./scripts/package_release_evidence_bundle.ps1
          ./scripts/assert_evidence_bundle_contents.ps1 2>&1 | Tee-Object -FilePath release_evidence/release-evidence-bundle-contents.log
          New-Item -ItemType Directory -Force -Path release_evidence/artifacts | Out-Null
          Copy-Item -Path store_listing/release/generated_release_evidence_report.md -Destination release_evidence/artifacts/generated_release_evidence_report.md -ErrorAction SilentlyContinue
          Copy-Item -Path store_listing/release/generated_next_release_steps.md -Destination release_evidence/artifacts/generated_next_release_steps.md -ErrorAction SilentlyContinue
          Copy-Item -Path store_listing/release/airmius_release_evidence_bundle.zip -Destination release_evidence/artifacts/airmius_release_evidence_bundle.zip -ErrorAction SilentlyContinue

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airmius-mobile-release-evidence
          path: mobile/airmius_mobile/release_evidence
