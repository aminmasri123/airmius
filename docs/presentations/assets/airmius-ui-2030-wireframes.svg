<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">AIRMIUS UI 2030 – Desktop- und Mobile-Wireframes</title>
  <desc id="desc">Ein moderner Desktop-Arbeitsbereich mit globaler Navigation, Teamkontext, Tagesfokus und Datenschutzstatus sowie eine mobile Heute-Ansicht mit fünf Hauptbereichen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#0b1e2c"/>
      <stop offset="1" stop-color="#102a32"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54d6c1"/>
      <stop offset="1" stop-color="#8ee7a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .label{font:600 13px Inter,Arial,sans-serif;fill:#91a6b5;letter-spacing:.08em}
      .body{font:500 14px Inter,Arial,sans-serif;fill:#dbe7ed}
      .small{font:500 12px Inter,Arial,sans-serif;fill:#91a6b5}
      .nav{font:650 14px Inter,Arial,sans-serif;fill:#b9c9d2}
      .navon{font:700 14px Inter,Arial,sans-serif;fill:#07131f}
      .h1{font:750 28px Inter,Arial,sans-serif;fill:#f7fbfc}
      .h2{font:700 18px Inter,Arial,sans-serif;fill:#f7fbfc}
      .metric{font:750 26px Inter,Arial,sans-serif;fill:#f7fbfc}
      .dark{fill:#07131f}
    </style>
  </defs>

  <rect width="1600" height="1020" rx="32" fill="url(#bg)"/>
  <circle cx="1440" cy="90" r="230" fill="#51d5be" opacity=".06"/>
  <circle cx="108" cy="914" r="260" fill="#56a7ff" opacity=".05"/>

  <text x="70" y="64" class="label" fill="#54d6c1">AIRMIUS · EXPERIENCE CONCEPT 2030</text>
  <text x="70" y="104" class="h1">Ein System. Der richtige Kontext. Die nächste klare Aktion.</text>

